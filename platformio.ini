[env:esp32poe]
; espressif32 8.0.0 is the first PlatformIO platform release with Arduino-ESP32 v3 (3.3.x)
platform = espressif32 @ 8.0.0
board = esp32-poe
framework = arduino
; upload_port = COM7
; monitor_port = COM[7]
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
monitor_speed = 115200
lib_ldf_mode = chain
; 3MB app / 896KB SPIFFS, no OTA slot. The v3 image (~1.5MB) no longer fits default.csv
board_build.partitions = huge_app.csv
build_flags = 
	-I$PROJECT_DIR/include/
	-D ONE_WIRE_BUS=4
	-D KEY_RESET=34
	-D ERROR_LED=15
	-D STATUS_LED=15
	-D WIFI_LED=16
	-D SENSOR_TIME=10
lib_deps =
	0neblock/SNMP_Agent @ 2.1.0
	paulstoffregen/OneWire @ 2.3.8
	milesburton/DallasTemperature @ 3.11.0
	esp32async/AsyncTCP @ 3.5.0
	esp32async/ESPAsyncWebServer @ 3.12.1
	bblanchon/ArduinoJson @ 7.4.3
	
