[platformio]
default_envs = esp32poe

; Settings shared by all boards
[env]
; espressif32 8.0.0 is the first PlatformIO platform release with Arduino-ESP32 v3 (3.3.x)
platform = espressif32 @ 8.0.0
framework = arduino
; upload_port = COM7
; monitor_port = COM[7]
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
monitor_speed = 115200
lib_ldf_mode = chain
; Two 1.75MB app slots for OTA updates and 448KB of SPIFFS. Changing the table needs one USB upload
; of both the firmware and the filesystem image. See BUILDING.md
board_build.partitions = partitions.csv
; The filesystem image is built from a gzipped copy of data/
extra_scripts = pre:scripts/gzip_data.py
build_flags = 
	-I$PROJECT_DIR/include/
	-D SENSOR_TIME=10
	-D FALLBACK_RETRY_TIME=60
	-D RUNTIME_REBOOT_HOLD_TIME=5
lib_deps =
	0neblock/SNMP_Agent @ 2.1.0
	paulstoffregen/OneWire @ 2.3.8
	milesburton/DallasTemperature @ 3.11.0
	esp32async/AsyncTCP @ 3.5.0
	esp32async/ESPAsyncWebServer @ 3.12.1
	bblanchon/ArduinoJson @ 7.4.3

; Ethernet PHY settings (ETH_PHY_*, ETH_CLK_MODE) come from each board's variant

; Olimex ESP32-POE: LAN8720 at address 0, PHY power on GPIO12, clock out on GPIO17
[env:esp32poe]
board = esp32-poe
build_flags = 
	${env.build_flags}
	-D ONE_WIRE_BUS=4
	-D KEY_RESET=34
	-D ERROR_LED=14
	-D STATUS_LED=15
	-D WIFI_LED=16

; WT32-ETH01: LAN8720 at address 1, PHY power (oscillator enable) on GPIO16, clock in on GPIO0.
; PROVISIONAL pin map until the PCB is designed. The board has no user button: KEY_RESET on
; GPIO39 is input-only and needs an external pull-up and button. GPIO2 and GPIO15 are strapping
; pins, which is fine for LEDs.
[env:wt32-eth01]
board = wt32-eth01
build_flags = 
	${env.build_flags}
	-D ONE_WIRE_BUS=4
	-D KEY_RESET=39
	-D ERROR_LED=14
	-D STATUS_LED=2
	-D WIFI_LED=15
